name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose interpolation and model
        run: docker compose --env-file .env.example config --quiet
      - name: Validate environment contract
        run: python3 scripts/validate_env_contract.py

  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yamllint==1.37.1
      - run: yamllint docker-compose.yml releases/manifest.yaml .github/workflows/ci.yml

  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema==0.35.0 jsonschema==4.25.1
      - name: Validate release manifest
        run: check-jsonschema --schemafile releases/manifest.schema.json releases/manifest.yaml
      - name: Test release-state invariants
        run: python3 scripts/test_release_manifest_schema.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

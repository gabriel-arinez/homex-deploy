name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose -f docker-compose.yml -f compose.d03-media.yml --env-file .env.example config --quiet
      - run: docker compose -f docker-compose.yml -f compose.production.yml --env-file .env.production.example --profile operations config --quiet
      - run: python3 scripts/validate_env_contract.py
      - run: python3 scripts/test_d02_contract.py
      - run: python3 scripts/test_d03_contract.py
      - run: python3 scripts/test_d04_contract.py

  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yamllint==1.37.1
      - run: yamllint docker-compose.yml compose.d03-media.yml compose.production.yml releases/manifest.yaml .github/workflows/ci.yml

  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema==0.35.0 jsonschema==4.25.1
      - run: check-jsonschema --schemafile releases/manifest.schema.json releases/manifest.yaml
      - run: python3 scripts/test_release_manifest_schema.py

  asr-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML==6.0.3
      - name: Verify pinned ASR snapshot LFS oid
        run: python3 scripts/verify_asr_model.py --remote-lfs-pointer

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gabriel-arinez/homex-backend
          ref: bc375894036d30cefbc8cdf7c512315aaf1ab971
          path: sources/backend
      - uses: actions/checkout@v4
        with:
          repository: gabriel-arinez/homex-frontend
          ref: 479a092462b36a90006eb1c52f9570ea63084bab
          path: sources/frontend
      - name: Build D07 API/worker and frontend/proxy images without cache
        env:
          BACKEND_CONTEXT: ./sources/backend
          FRONTEND_CONTEXT: ./sources/frontend
        run: |
          docker compose -f docker-compose.yml -f compose.production.yml \
            --env-file .env.production.example build --no-cache backend frontend-proxy
          api_id=$(docker image inspect homex/backend:d07-bc37589 --format '{{.Id}}')
          frontend_id=$(docker image inspect homex/frontend-proxy:d07-479a092 --format '{{.Id}}')
          echo "D07_API_IMAGE_ID=$api_id"
          echo "D07_FRONTEND_IMAGE_ID=$frontend_id"
          expected_api=$(awk '$1 == "api:" {print $2}' releases/manifest.yaml)
          expected_worker=$(awk '$1 == "worker:" {print $2}' releases/manifest.yaml)
          expected_frontend=$(awk '$1 == "frontend_proxy:" {print $2}' releases/manifest.yaml)
          test "$expected_api" = "homex/backend:d07-bc37589"
          test "$expected_worker" = "homex/backend:d07-bc37589"
          test "$expected_frontend" = "homex/frontend-proxy:d07-479a092"
          test "$(docker image inspect homex/backend:d07-bc37589 --format '{{index .RepoTags 0}}')" = "homex/backend:d07-bc37589"
          test "$(docker image inspect homex/frontend-proxy:d07-479a092 --format '{{index .RepoTags 0}}')" = "homex/frontend-proxy:d07-479a092"
          HOMEX_RELEASE_IMAGE_EVIDENCE=/tmp/d07-images.json python3 scripts/verify_release_images.py
          test -s /tmp/d07-images.json

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gabriel-arinez/homex-backend
          ref: bc375894036d30cefbc8cdf7c512315aaf1ab971
          path: sources/backend
      - name: Prepare read-only ASR mount fixture
        run: |
          mkdir -p /tmp/homex-asr-model
          touch /tmp/homex-asr-model/model.bin
      - name: Run D01 integration and resilience gates
        env:
          ASR_MODEL_SOURCE: /tmp/homex-asr-model
          BACKEND_CONTEXT: ./sources/backend
          POSTGRES_USER: postgres
          POSTGRES_DB: homex
          D01_COMPOSE_PROJECT: homex-d01-ci
        run: sh scripts/test_d01_runtime.sh


  staging-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gabriel-arinez/homex-backend
          ref: bc375894036d30cefbc8cdf7c512315aaf1ab971
          path: sources/backend
      - uses: actions/checkout@v4
        with:
          repository: gabriel-arinez/homex-frontend
          ref: 479a092462b36a90006eb1c52f9570ea63084bab
          path: sources/frontend
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: sources/frontend/package-lock.json
      - name: Install browser smoke dependencies
        working-directory: sources/frontend
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Run D02 staging browser/API gates
        env:
          BACKEND_CONTEXT: ./sources/backend
          FRONTEND_CONTEXT: ./sources/frontend
          POSTGRES_USER: postgres
          POSTGRES_DB: homex
          D02_COMPOSE_PROJECT: homex-d02-ci
          D02_BROWSER_SMOKE: "1"
        run: sh scripts/test_d02_staging.sh

  media-local-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gabriel-arinez/homex-backend
          ref: bc375894036d30cefbc8cdf7c512315aaf1ab971
          path: sources/backend
      - uses: actions/checkout@v4
        with:
          repository: gabriel-arinez/homex-frontend
          ref: 479a092462b36a90006eb1c52f9570ea63084bab
          path: sources/frontend
      - name: Run D03 local media production gate
        env:
          BACKEND_CONTEXT: ./sources/backend
          FRONTEND_CONTEXT: ./sources/frontend
          POSTGRES_USER: postgres
          POSTGRES_DB: homex
          D03_COMPOSE_PROJECT: homex-d03-ci
          D03_MEDIA_HOST_PATH: /tmp/homex-d03-media
        run: sh scripts/test_d03_media.sh

  private-release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gabriel-arinez/homex-backend
          ref: bc375894036d30cefbc8cdf7c512315aaf1ab971
          path: sources/backend
      - uses: actions/checkout@v4
        with:
          repository: gabriel-arinez/homex-frontend
          ref: 479a092462b36a90006eb1c52f9570ea63084bab
          path: sources/frontend
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: sources/frontend/package-lock.json
      - uses: actions/cache@v4
        with:
          path: .cache/d04-asr
          key: d04-faster-whisper-small-536b0662742c
      - name: Install browser and deterministic audio dependencies
        run: |
          cd sources/frontend
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y espeak-ng
      - name: Configure private hostname for CI
        run: echo '127.0.0.1 homex.internal' | sudo tee -a /etc/hosts
      - name: Run D04 private release candidate gate
        env:
          BACKEND_CONTEXT: ./sources/backend
          FRONTEND_CONTEXT: ./sources/frontend
          D04_COMPOSE_PROJECT: homex-d04-ci
          D04_MEDIA_HOST_PATH: /tmp/homex-d04-media
          D04_ASR_MODEL_PATH: ${{ github.workspace }}/.cache/d04-asr
          D07_EVIDENCE_DIR: /tmp/homex-d07-evidence
        run: sh scripts/test_d04_candidate.sh
      - name: Upload D07 ASR profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d07-asr-runtime-profile
          path: /tmp/homex-d07-evidence/asr-runtime.json
          if-no-files-found: error
          retention-days: 14
      - name: Collect D04 logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f compose.production.yml \
            --project-name homex-d04-ci --env-file .env.production.example \
            --profile operations --profile build logs --no-color > /tmp/d04-compose.log || true
      - name: Upload D04 evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: d04-private-release-evidence
          path: |
            /tmp/d04-compose.log
            sources/frontend/test-results/playwright-d04/
          if-no-files-found: ignore
          retention-days: 7

  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gabriel-arinez/homex-backend
          ref: bc375894036d30cefbc8cdf7c512315aaf1ab971
          path: sources/backend
      - run: python3 scripts/test_media_inventory.py
      - run: python3 scripts/test_d05_contract.py
      - name: Run destructive D05 backup and restore gate
        env:
          BACKEND_CONTEXT: ./sources/backend
          D05_COMPOSE_PROJECT: homex-d05-ci
          D05_WORK_DIR: /tmp/homex-d05-ci
        run: sh scripts/test_d05_recovery.sh


  resilience-observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gabriel-arinez/homex-backend
          ref: bc375894036d30cefbc8cdf7c512315aaf1ab971
          path: sources/backend
      - uses: actions/checkout@v4
        with:
          repository: gabriel-arinez/homex-frontend
          ref: 479a092462b36a90006eb1c52f9570ea63084bab
          path: sources/frontend
      - name: Run D06 observability and destructive resilience gate
        env:
          BACKEND_CONTEXT: ./sources/backend
          FRONTEND_CONTEXT: ./sources/frontend
          D06_COMPOSE_PROJECT: homex-d06-ci
          D06_WORK_DIR: /tmp/homex-d06-ci
        run: sh scripts/test_d06_resilience.sh
      - name: Collect D06 logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f compose.production.yml \
            --project-name homex-d06-ci --env-file .env.production.example \
            --profile operations --profile observability logs --no-color \
            > /tmp/d06-compose.log || true
      - name: Upload D06 evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: d06-resilience-evidence
          path: /tmp/d06-compose.log
          if-no-files-found: ignore
          retention-days: 7

  d07-release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema==0.35.0 jsonschema==4.25.1
      - run: check-jsonschema --schemafile releases/manifest.schema.json releases/manifest.yaml
      - run: python3 scripts/test_release_manifest_schema.py
      - run: python3 scripts/test_d07_contract.py
      - run: sh scripts/test_d07_offsite.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
